name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Lint, format, types, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4

      # Version comes from "packageManager" in frontend/package.json
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: frontend/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      # Check-only variants (no --fix): CI must fail instead of silently fixing.
      - run: pnpm run check:oxlint
      - run: pnpm run check:eslint
      - run: pnpm run check:format
      - run: pnpm run check:types

      # Build without env: Supabase vars are checked at runtime, not at build time.
      - run: pnpm run check:build
